# Publishes to the VS Code Marketplace and creates a GitHub release when you push a
# version tag, e.g.:
#   npm version patch        # bumps package.json, commits, tags v0.3.2
#   git push --follow-tags
# Needs the repo secret VSCE_PAT (Azure DevOps token with Marketplace > Manage scope).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Tag must match package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $v"
            exit 1
          fi

      - run: npm test
      - run: npx vsce package

      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: GitHub release with the .vsix
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "Commander Flash ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
