# Publishes to the VS Code Marketplace and creates a GitHub release when you push a
# version tag, e.g.:
#   npm version patch        # bumps package.json, commits, tags v0.3.2
#   git push --follow-tags
# Always: tests, builds the .vsix, and attaches it to a GitHub release.
# Marketplace: published automatically only if the repo secret VSCE_PAT is set. Otherwise,
# upload the .vsix from the release at https://marketplace.visualstudio.com/manage.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  VSCE_PAT: ${{ secrets.VSCE_PAT }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag must match package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $v"
            exit 1
          fi

      - run: npm test
      - run: npx vsce package

      - name: Publish to the VS Code Marketplace (only if VSCE_PAT is set)
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath *.vsix

      - name: GitHub release with the .vsix
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "Commander Flash ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
