# Publishes to the VS Code Marketplace and creates a GitHub release when you push a
# version tag, e.g.:
#   npm version patch        # bumps package.json, commits, tags v0.3.2
#   git push --follow-tags
# Always: tests, builds the .vsix, and attaches it to a GitHub release.
# Marketplace: published automatically only if the repo secret VSCE_PAT is set. Otherwise,
# upload the .vsix from the release at https://marketplace.visualstudio.com/manage.
# Open VSX (Cursor, VSCodium, Windsurf): published if the repo secret OVSX_PAT is set.
# Re-run an existing tag (e.g. to publish it to Open VSX later): Actions -> Release -> Run workflow.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.3.1"
        required: true

permissions:
  contents: write

env:
  VSCE_PAT: ${{ secrets.VSCE_PAT }}
  OVSX_PAT: ${{ secrets.OVSX_PAT }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag must match package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $v"
            exit 1
          fi

      - run: npm test
      - run: npx vsce package

      - name: Publish to the VS Code Marketplace (only if VSCE_PAT is set)
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath *.vsix

      - name: Publish to Open VSX (only if OVSX_PAT is set)
        if: env.OVSX_PAT != ''
        run: |
          publisher="$(node -p "require('./package.json').publisher")"
          npx ovsx create-namespace "$publisher" -p "$OVSX_PAT" || true   # already exists after the first run
          npx ovsx publish *.vsix -p "$OVSX_PAT"

      - name: GitHub release with the .vsix
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.vsix --clobber
          else
            gh release create "$TAG" *.vsix --title "Commander Flash ${TAG#v}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
